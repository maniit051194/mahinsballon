const addE=()=>{const g=i=>$('#'+i).value.trim();if(!g('an'))return toast('Add a name');ST.set('enq',[{n:g('an'),p:g('ap'),e:g('ae'),d:g('ad'),s:'New',t:td(),v:''},...EQ()]);go()};

function addIt(){const s=$('#si').value,d=$('#sd').value.trim()||s;if(!d)return toast('Select or type an item');inv.items.push({d,q:+$('#sq').value||1,r:+$('#sr').value||0});$('#sd').value='';items();upd()}

F(800,24);T('Grand Total',640,y+3*26+16,'right');x.fillStyle='#c42a67';T(inr(c.tot),W-50,y+3*26+16,'right');x.fillStyle='#25234a';y+=3*26+56;

function save(){gen();const a=INV().filter(x=>x.no!==inv.no),old=INV().find(x=>x.no===inv.no);ST.set('invs',[{no:inv.no,n:inv.n,p:inv.p,em:inv.em,e:inv.e,d:inv.d,v:inv.v,items:inv.items,dt:inv.dt,dv:inv.dv,total:calc().tot,st:old?old.st:'Pending',date:td()},...a]);toast('Saved to Invoices')}
async function shareBill(){if(!inv.shown)gen();const m=msg(),b=await billCanvas(),f=new File([b],'Invoice-'+inv.no+'.png',{type:'image/png'}),num=inv.p.replace(/\D/g,'')||CF().wa,cf=CF(),u=cf.upi?`upi://pay?pa=${encodeURIComponent(cf.upi)}&pn=${encodeURIComponent(cf.payee||'Mahin’s Balloon Wiz Events')}&am=${calc().tot.toFixed(2)}&cu=INR`:'';
$('#ch').innerHTML=`<h3 class="at">WhatsApp Payment Link (Customer View)</h3><div class="wph"><div class="wah"><img src="${IM.logo}" alt="">Mahin’s Balloon Wiz Events</div><div class="wab"><div class="bub"><img src="${URL.createObjectURL(b)}" alt="Invoice with payment QR">${esc(m)}<button class="pay" id="pn">Pay Now - ${inr(calc().tot)}</button><small style="display:block;text-align:right;color:#667">${new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}</small></div></div></div><div class="acts"><button class="btn wa" id="sw">Share bill + QR on WhatsApp</button><button class="btn alt" id="sm">Open customer chat with message</button></div><p class="mu" style="max-width:56ch">Share attaches the bill image and message; pick the customer in WhatsApp. If it does not open, press and hold the bill image to save it, then attach it in the chat.</p>`;
$('#pn').onclick=()=>u?location.href=u:toast('Add your UPI ID in Settings first');
$('#sw').onclick=async()=>{try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],text:m,title:'Invoice '+inv.no});return}}catch(e){if(e.name==='AbortError')return}wa(m,num);toast('Attach the saved bill image in WhatsApp')};$('#sm').onclick=()=>wa(m,num)}
const C=['#f472a8','#744cb8','#84dec4','#ffd35e','#ff8f70'],MEL=[[0,523],[.3,659],[.6,784],[.9,1047],[1.3,1319],[1.3,1047],[1.3,784],[2,988],[2.3,1175],[2.9,1047],[2.9,1319],[2.9,1568]];
function play(){if(played)return;played=true;const n=ac.currentTime;mg.gain.setValueAtTime(.14,n);mg.gain.linearRampToValueAtTime(0,n+6);MEL.forEach(([t,f])=>{const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0,n+t);g.gain.linearRampToValueAtTime(.5,n+t+.03);g.gain.exponentialRampToValueAtTime(.001,n+t+1.5);o.connect(g);g.connect(mg);o.start(n+t);o.stop(n+t+1.6)})}
function en(){if(ac)ac.resume().then(()=>{$('#tp').hidden=true;play()}).catch(()=>{})}
function mute(){muted=!muted;ss('mbw_m',muted?'1':'0');if(vg)vg.gain.value=muted?0:1;$('#mt').textContent=muted?'🔇':'🔊'}
function endIntro(){clearTimeout(tmo);const el=$('#intro');if(!el)return;try{vg.gain.setValueAtTime(vg.gain.value,ac.currentTime);vg.gain.linearRampToValueAtTime(0,ac.currentTime+.6)}catch(e){}el.classList.add('out');setTimeout(()=>{el.hidden=true;try{ac&&ac.close()}catch(e){}},900)}
function intro(){const el=$('#intro');$('#tp').hidden=true;played=false;const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;$('#mt').textContent=muted?'🔇':'🔊';
if(!rm){for(let i=0;i<16;i++){const b=document.createElement('i');b.className='ib';b.style.cssText=`left:${2+i*6}%;--d:${4.5+Math.random()*2.5}s;--x:${Math.random()*70-35}px;animation-delay:${Math.random()*1.6}s;background:${C[i%5]};width:${34+Math.random()*30}px;height:${42+Math.random()*34}px`;el.prepend(b)}
try{ac=new(window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();vg=ac.createGain();vg.gain.value=muted?0:1;mg.connect(vg);vg.connect(ac.destination);if(ac.state==='running')play();else $('#tp').hidden=false}catch(e){}}
el.addEventListener('pointerdown',()=>{if(!$('#tp').hidden)en()});tmo=setTimeout(endIntro,rm?1800:7000)}

function replayIntro(){const el=$('#intro');el.querySelectorAll('.ib').forEach(b=>b.remove());const l=el.querySelector('.lk');l.replaceWith(l.cloneNode(true));el.hidden=false;el.classList.remove('out');scrollTo(0,0);intro()}
function go(){clearInterval(tm);$('#nav').classList.remove('open');const h=(location.hash||'#home').slice(1),k=V[h]?h:'home';$('#nav').innerHTML=[['home','Home'],['about','About Us'],['services','Services'],['packages','Packages'],['gallery','Gallery'],['contact','Contact Us']].map(([x,l])=>`<a href="#${x}" class="${x===k?'on':''}" ${x===k?'aria-current="page"':''}>${l}</a>`).join('');$('#app').innerHTML=V[k]();if(AF[k])AF[k]();if(k==='admin'&&authed&&at==='Create Invoice'){items();upd()}ft()}
addEventListener('hashchange',()=>{go();scrollTo(0,0)});go();intro();
